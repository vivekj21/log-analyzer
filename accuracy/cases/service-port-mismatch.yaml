# expect: SERVICE_MISROUTE
# symptom: shop gets connection errors when it talks to web
# set: dev
# service: shop
# verify: logs_have shop 'refused|can.t connect' && logs_have web 'listening on 8080'
# must-mention: (9090|targetPort|port)
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: la-acc-service-port-mismatch}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "listening on 8080"
              exec httpd -f -p 8080 -h /tmp
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: la-acc-service-port-mismatch}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: la-acc-service-port-mismatch}
spec:
  replicas: 1
  selector: {matchLabels: {app: shop}}
  template:
    metadata: {labels: {app: shop}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%T) ERROR: GET http://web/ failed: $(wget -q -T 3 -O- http://web/ 2>&1 | head -c 150)"
                sleep 5
              done
