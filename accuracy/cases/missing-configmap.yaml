# expect: MISSING_CONFIG_OBJECT
# symptom: the mailer pod never reaches Running
# set: dev
# service: mailer
# verify: reasons_have mailer 'CreateContainerConfigError'
# must-mention: app-settings
apiVersion: apps/v1
kind: Deployment
metadata: {name: mailer, namespace: la-acc-missing-configmap}
spec:
  replicas: 1
  selector: {matchLabels: {app: mailer}}
  template:
    metadata: {labels: {app: mailer}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              sleep 3600
          envFrom:
            - configMapRef: {name: app-settings}
