# expect: STORAGE_FAIL
# symptom: the reports pod never starts
# set: dev
# service: reports
# verify: has_event 'fast-ssd|unbound'
# must-mention: (storage ?class|fast-ssd|PersistentVolumeClaim|PVC)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: data, namespace: la-acc-pvc-bad-storageclass}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reports, namespace: la-acc-pvc-bad-storageclass}
spec:
  replicas: 1
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports}}
    spec:
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: data}}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              sleep 3600
          volumeMounts: [{name: data, mountPath: /data}]
