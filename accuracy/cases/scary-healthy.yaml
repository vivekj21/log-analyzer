# expect: NO_FAULT
# symptom: monitoring sent a warning alert about the ingest service
# set: heldout
# service: ingest
# verify: logs_have ingest 'retry 1/3 succeeded' && [ "$(restarts ingest)" = 0 ]
# must-mention: (retry|WARN|slow query)
# must-not-claim: OOMKilled
# must-not-claim: CrashLoopBackOff
# note: false alarm: warnings that resolve themselves; nothing is broken
apiVersion: apps/v1
kind: Deployment
metadata: {name: ingest, namespace: la-acc-scary-healthy}
spec:
  replicas: 1
  selector: {matchLabels: {app: ingest}}
  template:
    metadata: {labels: {app: ingest}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1)); echo "INFO processed batch $i, 128 records"
                [ $((i%5)) = 0 ] && echo "WARN slow query 1200ms (threshold 1000ms)"
                [ $((i%7)) = 0 ] && echo "WARN upstream call failed, retry 1/3 succeeded"
                sleep 3
              done
