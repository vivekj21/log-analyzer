# expect: DNS_FAIL
# symptom: the orders page shows errors when a customer pays
# set: dev
# service: orders
# verify: logs_have orders 'bad address'
# must-mention: payments-service
# must-mention: (DNS|resolve|lookup|bad address|no such host)
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments, namespace: la-acc-dns-wrong-name}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments}}
  template:
    metadata: {labels: {app: payments}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "listening on 8080"
              exec httpd -f -p 8080 -h /tmp
---
apiVersion: v1
kind: Service
metadata: {name: payments, namespace: la-acc-dns-wrong-name}
spec:
  selector: {app: payments}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: inventory, namespace: la-acc-dns-wrong-name}
spec:
  replicas: 1
  selector: {matchLabels: {app: inventory}}
  template:
    metadata: {labels: {app: inventory}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do echo "INFO stock check ok"; sleep 5; done
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: la-acc-dns-wrong-name}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%T) ERROR: POST http://payments-service:8080/charge failed: $(wget -q -T 3 -O- http://payments-service:8080/charge 2>&1 | head -c 150)"
                sleep 5
              done
