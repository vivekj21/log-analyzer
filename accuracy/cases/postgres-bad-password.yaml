# expect: CRASHLOOP_BAD_CONFIG
# symptom: the API cannot reach its database
# set: heldout
# service: api
# verify: logs_have postgres 'superuser password is not specified'
# must-mention: POSTGRES_PASSWORD
# note: the visible errors are in the API; the first thing that broke is the Postgres pod, which crashes at start
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: la-acc-postgres-bad-password}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: app
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: app}
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: la-acc-postgres-bad-password}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: la-acc-postgres-bad-password}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: app
          image: postgres:16-alpine
          env:
            - {name: PGHOST, value: postgres}
            - {name: PGUSER, value: app}
            - {name: PGPASSWORD, value: secret}
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "$(date +%T) ERROR: database check failed: $(psql -c 'select 1' 2>&1 | head -c 200)"
                sleep 5
              done
