# expect: OOM_KILLED
# symptom: pod keeps restarting and being killed
apiVersion: apps/v1
kind: Deployment
metadata: {name: oom, namespace: la-acc-oom}
spec:
  replicas: 1
  selector: {matchLabels: {app: oom}}
  template:
    metadata: {labels: {app: oom}}
    spec:
      containers:
        - name: stress
          image: polinux/stress
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "200M", "--vm-hang", "1"]
          resources:
            requests: {memory: 20Mi}
            limits: {memory: 50Mi}
