{{- if .Values.rbac.create }}
{{- /* Default: read access only in the namespaces being investigated (one Role each). rbac.clusterWide=true gives one cluster-wide role, which is also what the node tool needs. */}}
{{- $sa := .Values.serviceAccount.name | default .Release.Name }}
{{- $name := printf "%s-reader" .Release.Name }}
{{- $nss := list .Values.investigation.namespace }}
{{- if .Values.server.enabled }}{{- $nss = .Values.server.namespaces }}{{- end }}
{{- if and .Values.server.enabled (not .Values.rbac.clusterWide) (not $nss) }}
{{- fail "server.namespaces is required: list the namespaces the service may read (for example server.namespaces={shop}), or set rbac.clusterWide=true" }}
{{- end }}
{{- $root := . }}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
{{- include "log-analyzer.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $i, $ns := $nss }}
{{- if $i }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
rules:
{{- include "log-analyzer.rules" $root | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
