{{- if not (has .Values.llm.mode (list "live" "heuristic")) }}
{{- fail "llm.mode must be live or heuristic" }}
{{- end }}
{{- if not (has .Values.llm.provider (list "gemini" "openai" "anthropic")) }}
{{- fail "llm.provider must be gemini, openai or anthropic" }}
{{- end }}
{{- if and (eq .Values.llm.mode "live") (not .Values.llm.acknowledgeDataLeavesCluster) }}
{{- fail "llm.mode=live sends log text from your cluster to the model service (see llm.provider). Read docs/DATA-FLOW.md, then add --set llm.acknowledgeDataLeavesCluster=true to confirm. Or use llm.mode=heuristic to keep everything inside the cluster." }}
{{- end }}
{{- if and (eq .Values.llm.mode "live") (ne .Values.llm.provider "gemini") (not .Values.llm.model) }}
{{- fail "llm.model is required when llm.provider is openai or anthropic" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: log-analyzer
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-analyzer
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001          # lets the app read the mounted key file (mode 0440)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analyzer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ printf "--namespace=%s" .Values.investigation.namespace | quote }}
            {{- if .Values.investigation.service }}
            - {{ printf "--service=%s" .Values.investigation.service | quote }}
            {{- end }}
            - {{ printf "--symptom=%s" .Values.investigation.symptom | quote }}
            - {{ printf "--since=%s" .Values.investigation.since | quote }}
            - {{ printf "--timeout=%s" .Values.investigation.timeout | quote }}
            - {{ printf "--llm=%s" .Values.llm.mode | quote }}
            - "--git-repo=/data/incidents"
            {{- if .Values.investigation.dryRun }}
            - "--dry-run"
            {{- end }}
          env:
            - name: HOME
              value: /tmp
            {{- if eq .Values.llm.mode "live" }}
            - name: LLM_API_KEY_FILE
              value: /var/run/secrets/gemini/key
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            {{- if .Values.llm.baseUrl }}
            - name: LLM_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            {{- end }}
            {{- if .Values.llm.allowInsecureHttp }}
            - name: LLM_ALLOW_HTTP
              value: "true"
            {{- end }}
            {{- if .Values.llm.model }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.gemini.model }}
            - name: GEMINI_MODEL
              value: {{ .Values.gemini.model | quote }}
            {{- end }}
            - name: LOG_ANALYZER_MAX_CALLS
              value: {{ .Values.limits.maxCalls | quote }}
            - name: LOG_ANALYZER_MAX_TOKENS
              value: {{ .Values.limits.maxTokensPerInvestigation | quote }}
            - name: LOG_ANALYZER_MAX_TOTAL_TOKENS
              value: {{ .Values.limits.maxTotalTokens | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            {{- if eq .Values.llm.mode "live" }}
            - name: gemini-key
              mountPath: /var/run/secrets/gemini
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq .Values.llm.mode "live" }}
        - name: gemini-key
          secret:
            secretName: {{ required "llm.apiKeySecret (or gemini.existingSecret) is required" (default .Values.gemini.existingSecret .Values.llm.apiKeySecret) }}
            defaultMode: 0440
            items:
              - key: {{ default .Values.gemini.secretKey .Values.llm.apiKeySecretKey }}
                path: key
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.storage.persistence }}
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim | default (printf "%s-incidents" .Release.Name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
