image:
  repository: log-analyzer
  tag: "0.1.0"
  pullPolicy: IfNotPresent
gemini:
  model: ""             # empty = built-in default
  existingSecret: ""    # name of a Secret holding the API key (required in live mode)
  secretKey: GEMINI_API_KEY   # the key inside that Secret; it is mounted as a read-only file, not an env var
llm:
  mode: heuristic       # heuristic = rule-based, nothing leaves the cluster (default, less accurate)
                        # live = real Gemini: log text leaves the cluster, see docs/DATA-FLOW.md
  acknowledgeDataLeavesCluster: false   # must be true when mode is live
  provider: gemini      # gemini | openai (any OpenAI-compatible server) | anthropic
  model: ""             # gemini: empty = built-in default. openai and anthropic: required
  baseUrl: ""           # openai/anthropic only, e.g. https://api.groq.com/openai/v1 ; empty = the service's own address
  allowInsecureHttp: false   # true only for a model server inside your own cluster reached over plain http
  apiKeySecret: ""      # name of the Secret holding the API key (falls back to gemini.existingSecret)
  apiKeySecretKey: ""   # the key's name inside that Secret (falls back to gemini.secretKey)
server:                 # false = one-off Job (above). true = an always-on web service instead of the Job (docs/API.md)
  enabled: false
  namespaces: []        # namespaces it may investigate, e.g. [shop, payments]. Gets one read-only Role in each.
                        # Required unless rbac.clusterWide=true (then empty = every namespace)
  tokenSecret: ""       # name of a Secret with the key "token" (16+ characters). Empty = the chart makes <release>-token with a random token
  port: 8080
  queue: 5              # investigations that may wait behind the running one
  timeout: 10m          # longest time one investigation may run
  serviceType: ClusterIP   # TLS (https) is your ingress's job: the service speaks plain http inside the cluster
investigation:
  namespace: default
  service: ""
  symptom: "CrashLoopBackOff and high 5xx error rate observed in logs"
  since: 1h
  timeout: 10m
  dryRun: false
limits:               # 0 disables a limit
  maxCalls: 30
  maxTokensPerInvestigation: 400000
  maxTotalTokens: 4000000
job:
  ttlSecondsAfterFinished: 86400
resources:            # requests and limits of the analyzer container
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 512Mi}
rbac:
  create: true
  clusterWide: false       # false = read access only in investigation.namespace (that namespace must already exist).
                           # The node tool (get_node_conditions) needs cluster-wide reads, so it is refused in this mode.
                           # true = read access in every namespace, plus nodes (the older behaviour).
  allowConfigMaps: false   # keep false: ConfigMaps may hold secrets, and the tool refuses to read them by default too
serviceAccount:
  create: true
  name: ""
storage:
  persistence: false       # false = reports are lost when the pod is deleted
  size: 1Gi
  existingClaim: ""
