name: e2e
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  k3d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/15dd1e2dbd62c53ed990fce9b7332335e8cb053c/install.sh | TAG=v5.9.0 bash
      - name: End-to-end test on a throwaway k3d cluster
        run: ./scripts/k3d-e2e.sh
