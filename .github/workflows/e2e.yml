name: e2e
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  k3d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/15dd1e2dbd62c53ed990fce9b7332335e8cb053c/install.sh | TAG=v5.9.0 bash
      - name: End-to-end test on a throwaway k3d cluster
        run: ./scripts/k3d-e2e.sh
